repository_type: pipeline

nf_core_version: 4.2.2

lint:
  files_unchanged:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-plantgwas_logo_light.png
    - docs/images/nf-core-plantgwas_logo_light.png
    - docs/images/nf-core-plantgwas_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .github/workflows/linting.yml
    - .github/workflows/pr-comment.yml
  nextflow_config:
    - manifest.name
    - manifest.homePage
  multiqc_config:
    - report_comment
  files_exist:
    - CODE_OF_CONDUCT.md
    - assets/nf-core-plantgwas_logo_light.png
    - docs/images/nf-core-plantgwas_logo_light.png
    - docs/images/nf-core-plantgwas_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/branch.yml

template:
  org: vsatheesh
  name: plantgwas
  description: "Plant GWAS pipeline: raw genotypes to ranked candidate genes"
  author: Viswanathan Satheesh
  version: 0.1.0dev
  force: true
  outdir: .
  is_nfcore: false
